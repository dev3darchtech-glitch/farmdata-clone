name: Apply capture regression fix

on:
  push:
    branches:
      - fix/capture-drawer-symptom-input

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/capture-drawer-symptom-input
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply deterministic source patch
        run: python3 scripts/fix_capture_regressions.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Commit verified fix
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/farm/FarmDataScreens.tsx
          git commit -m "fix: keep capture drawers open and stabilize symptom input"
          git push origin HEAD:fix/capture-drawer-symptom-input
