name: Apply capture regression fix

on:
  push:
    branches:
      - fix/capture-drawer-symptom-input
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/capture-drawer-symptom-input
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply deterministic source patch
        run: python3 scripts/fix_capture_regressions.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        id: tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm test -- --runInBand 2>&1 | tee ../capture-test-output.txt

      - name: Run frontend lint
        id: lint
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../capture-lint-output.txt

      - name: Commit source fix and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/farm/FarmDataScreens.tsx capture-test-output.txt capture-lint-output.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: keep capture drawers open and stabilize symptom input"
            git push origin HEAD:fix/capture-drawer-symptom-input
          fi

      - name: Fail when verification fails
        if: steps.tests.outcome != 'success' || steps.lint.outcome != 'success'
        run: exit 1
