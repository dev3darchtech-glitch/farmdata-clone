name: Frontend OAuth regression

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/oauth-redirect-check.yml"
      - "frontend/app/auth-callback.tsx"
      - "frontend/hooks/useAuth.tsx"
      - "frontend/__tests__/oauth_redirect_posts.test.tsx"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oauth-redirect-check.yml"
      - "frontend/app/auth-callback.tsx"
      - "frontend/hooks/useAuth.tsx"
      - "frontend/__tests__/oauth_redirect_posts.test.tsx"
      - "frontend/package.json"
      - "frontend/package-lock.json"

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        id: tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm test -- --runInBand 2>&1 | tee ../frontend-test-output.txt

      - name: Run frontend lint
        id: lint
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../frontend-lint-output.txt

      - name: Upload failure diagnostics
        if: steps.tests.outcome != 'success' || steps.lint.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-output
          path: |
            frontend-test-output.txt
            frontend-lint-output.txt

      - name: Fail when verification fails
        if: steps.tests.outcome != 'success' || steps.lint.outcome != 'success'
        run: exit 1
