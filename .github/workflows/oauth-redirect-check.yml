name: Frontend OAuth regression

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/oauth-redirect-check.yml"
      - "frontend/app/auth-callback.tsx"
      - "frontend/hooks/useAuth.tsx"
      - "frontend/__tests__/oauth_redirect_posts.test.tsx"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oauth-redirect-check.yml"
      - "frontend/app/auth-callback.tsx"
      - "frontend/hooks/useAuth.tsx"
      - "frontend/__tests__/oauth_redirect_posts.test.tsx"
      - "frontend/package.json"
      - "frontend/package-lock.json"

permissions:
  contents: read

jobs:
  frontend-oauth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run OAuth redirect regression tests
        working-directory: frontend
        run: npm test -- --runInBand __tests__/oauth_redirect_posts.test.tsx

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
