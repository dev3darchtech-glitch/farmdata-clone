name: OAuth redirect check

on:
  push:
    branches:
      - fix/oauth-redirect-posts
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-oauth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run OAuth redirect regression tests
        id: oauth_tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm test -- --runInBand __tests__/oauth_redirect_posts.test.tsx 2>&1 | tee ../oauth-test-output.txt

      - name: Run frontend lint
        id: lint
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../oauth-lint-output.txt

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-verification-output
          path: |
            oauth-test-output.txt
            oauth-lint-output.txt

      - name: Fail when verification fails
        if: steps.oauth_tests.outcome != 'success' || steps.lint.outcome != 'success'
        run: exit 1
