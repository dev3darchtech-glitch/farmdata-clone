<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#31582b" />
    <title>FarmData — Figma to Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="catalog-shell">
      <aside class="catalog-sidebar" aria-label="Danh sách màn hình">
        <div class="catalog-brand">
          <img src="./assets/logo.svg" alt="FarmData" />
          <div>
            <strong>FarmData</strong>
            <span>Figma screen catalog</span>
          </div>
        </div>
        <label class="catalog-search">
          <span>⌕</span>
          <input
            id="screen-search"
            type="search"
            placeholder="Tìm màn hình..."
            autocomplete="off"
          />
        </label>
        <nav id="screen-navigation" class="screen-navigation"></nav>
        <div class="catalog-note">
          <strong>Vanilla HTML/CSS/JS</strong>
          <span
            >Không cần cài package. Mở trực tiếp hoặc chạy local server.</span
          >
        </div>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div>
            <span class="eyebrow">Figma → Code</span>
            <h1 id="workspace-title">FarmData</h1>
          </div>
          <div class="workspace-actions">
            <button id="toggle-device" class="workspace-button" type="button">
              Mobile 390 × 844
            </button>
            <a
              class="workspace-button primary"
              href="https://www.figma.com/design/J3A6lS3RMSg60vahHwMMgC/FARMDATA?node-id=0-1&m=dev"
              target="_blank"
              rel="noreferrer"
              >Mở Figma</a
            >
          </div>
        </header>

        <section class="preview-stage" aria-live="polite">
          <div id="device-frame" class="device-frame mobile">
            <div id="app" class="farm-app"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
